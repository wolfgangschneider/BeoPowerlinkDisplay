; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:m5stack-core2]
platform = espressif32
board = m5stack-core2
framework = arduino
monitor_speed = 115200
lib_deps = 
	m5stack/M5Core2@^0.1.0
	m5stack/M5Atom@^0.1.2
	mathertel/LiquidCrystal_PCF8574@^2.2.0
build_flags = -w -Dm5stackcore2
src_filter = +<*> -<.git/> -<.svn/> -<example/> -<examples/> -<test/> -<tests/> -<DisplayLCD.cpp>

[env:m5stack-atom]
platform = espressif32
board = m5stack-atom
framework = arduino
monitor_speed = 115200
lib_deps =
	fastled/FastLED @ ^3.5.0
	m5stack/M5Atom@^0.1.3
	mathertel/LiquidCrystal_PCF8574@^2.2.0
build_flags = -w -Dm5stackatom
src_filter = +<*> -<.git/> -<.svn/> -<example/> -<examples/> -<test/> -<tests/> -<DisplayM5Core2.cpp>
board_build.mcu = esp32
board_build.f_cpu = 240000000L
